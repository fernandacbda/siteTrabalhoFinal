<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nome Site</title>
	<link rel="stylesheet" href="../css/escrita.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="solway-regular">
	<header class="menu_header"> <!-- Alinhados lado ao lado quando usar CSS -->
		<div class="menu_container">
			<a href="index.html" class="nome_site solway-bold" >
				NOME SITE
			</a>
			<ul>
				<li>
					<a href="signup.html">
						Cadastre-se
					</a>
				</li>
				<li>
					<a href="login.html">
						Entrar
					</a>
				</li>
			</ul>
		</div>
	</header>
	<main class="page_container">
		<section class="form_container">
			<h2>Escrever Artigo</h2>
			<form>
				<label>Título: </label>
				<input type="text" name="nomeArtigo" class="nome_artigo" maxlength="100"><br><br>
				<label>Resumo: </label>
				<textarea type="text" name="resumoArtigo" class="resumo_artigo" maxlength="200"></textarea><br><br>
				<label>Texo do Artigo: </label>
				<textarea type="text" name="textoArtigo" class="texto_artigo"></textarea><br><br>
				<label>Imagem de Capa: </label>
				<input type="file" name="imagemArtigo"><br><br> <!-- Restringir para JPG e PNG, tamanho maximo 8mb -->
				<input type="submit" class="solway-regular"> <!-- Manda os dados pro banco e cria uma pagina com o artigo -->
			</form>
		</section>
	</main>
</body>
</html>
