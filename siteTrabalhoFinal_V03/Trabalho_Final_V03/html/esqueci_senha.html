<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nome Site</title>
	<link rel="stylesheet" href="../css/forms.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">
	<script src="../js/auth.js" defer></script>
</head>
<body class="solway-regular auth_page">
	<header class="menu_header"> <!-- Alinhados lado ao lado quando usar CSS -->
		<div class="menu_container">
			<a href="index.html" class="nome_site solway-bold">
				NOME SITE
			</a>
			<ul>
				<li><a href="signup.html">Cadastre-se</a></li>
				<li><a href="login.html">Entrar</a></li>
			</ul>
		</div>
	</header>
	<div class="auth_layout">
		<section class="auth_panel">
			<button type="button" class="btn_voltar" data-voltar="login.html"><span aria-hidden="true">←</span> Voltar</button>
			<main class="page_container">
				<section class="form_container">
					<h2>Esqueceu sua Senha?</h2>
					<form>
						<label>Email: </label>
						<input type="email" name="email">
						<input type="submit" class="solway-regular">
					</form>
				</section>
				<section class="links_form">
					<ul>
						<li><a href="signup.html">Gostaria de me Cadastrar</a></li>
						<li><a href="login.html">Gostaria de Entrar</a></li>
					</ul>
				</section>
			</main>
		</section>
		<aside class="auth_image" aria-hidden="true"></aside>
	</div>
</body>
</html>
