<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nome Site</title>
	<link rel="stylesheet" href="../css/pagprin.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">
	<script src="../js/auth.js" defer></script>
</head>
<body class="solway-regular">
	<header class="menu_header"> <!-- Alinhados lado ao lado quando usar CSS -->
		<div class="menu_container">
			<a href="index.html" class="nome_site solway-bold" >
				NOME SITE
			</a>
			<ul>
				<li>
					<a href="signup.html">
						Cadastre-se
					</a>
				</li>
				<li>
					<a href="login.html">
						Entrar
					</a>
				</li>
			</ul>
		</div>
	</header>
	<main class="page_container">
		<button type="button" class="btn_voltar" data-voltar="index.html"><span aria-hidden="true">←</span> Voltar</button>
		<section class="prin_header">
			<h2>
			Artigos
			</h2>
			<p>
				Veja o que nossos usuários estão falando sobre os restaurantes.
			</p>
		</section>
		<section class="sc_container"> <!-- Barra de busca e filtros, alinhados lado a lado quando usar CSS -->
			<form class="sc_form">
				<input type="text" name="busca" placeholder="Buscar">
				<select name="ordem"> <!-- A ordenação da lista é feita no JS -->
					<option value="recentes" selected>Mais Recentes</option>
					<option value="avaliacao">Melhor Avaliados</option>
					<option value="titulo">Título (A-Z)</option>
				</select>
				<input type="submit" value="Buscar" class="solway-regular">
			</form>
		</section>
		<section class="article_grid" aria-label="Artigos publicados"></section>
		<p id="public-articles-message" class="articles_empty" role="status" aria-live="polite"></p>
	</main>
	<div> 
		
	</div>
	<div> 
		
	</div>
	<div> 
		
	</div>
	<div>
		
	</div>
</body>
</html>
